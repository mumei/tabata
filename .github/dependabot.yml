version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Remove this exclusion when typescript-eslint and vue-tsc support TypeScript 7.
    # They currently require TypeScript <6.1 and <7, respectively.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <8.0.0']
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
